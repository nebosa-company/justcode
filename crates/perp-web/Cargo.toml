[package]
name = "perp-web"
description = "Perpetum harness — a web front end over a workspace (`L-34`)"
version.workspace = true
edition.workspace = true
license.workspace = true

# A binary of its own rather than a `perp web` subcommand, for one reason: this
# one opens a listening socket. `perp` is what an unattended loop runs, dozens
# of times a cycle, and a port is not a capability that should be one typo away
# from a process nobody is watching. Starting a server is a thing a person does.
[[bin]]
name = "perp-web"
path = "src/main.rs"

[dependencies]
perp-core = { path = "../perp-core" }

[lints]
workspace = true
