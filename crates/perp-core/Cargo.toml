[package]
name = "perp-core"
description = "Perpetum harness — the durable spine: binding, steps, journal, projection"
version.workspace = true
edition.workspace = true
license.workspace = true

# Almost no dependencies, on purpose. `N-11` puts the standard library first and
# the binding makes adding a crate an approval step; the journal's record shape
# is small enough that a hand-written JSON writer and scanner cost less than the
# approval would.
[dependencies]

# The one exception, approved by the operator on 2026-07-29 for `X-4` and for
# nothing else. A Windows job object with KILL_ON_JOB_CLOSE is the only way a
# step's whole process tree dies when the engine is killed -9; `taskkill /T`
# walks the parent chain, so an orphaned grandchild outlives it.
#
# Windows-only, and the feature list is the two headers actually used — a
# dependency approved for one purpose should not quietly bring the rest of Win32
# into the build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[lints]
workspace = true
