[workspace]
members = ["perp-core", "perp", "perp-web"]
resolver = "2"

# A workspace of its own, separate from ../src-tauri, so the editor's build
# never gains the harness's dependencies and `cargo tauri build` behaves exactly
# as it did before this directory existed (binding.md, "Code layout").

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.lints.rust]
# Was `forbid` for cycles 1–3, which was right while nothing needed it.
#
# `X-4` needs a real Windows job object so a step's children die even when the
# engine is killed -9, and the Win32 calls for that are `unsafe`. `forbid` cannot
# be relaxed at a module, so it is `deny` — every `unsafe` is still a compile
# error unless a module opts in by name, and exactly one does: `process::job`.
# The trade was made deliberately: `taskkill /T` walks the parent chain, so an
# orphaned grandchild survives it, and nothing survives the engine being killed.
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
