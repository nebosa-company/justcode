<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JustCode</title>
    <!-- Paint the themed background on the very first frame. Without this the
         webview shows its default white until the stylesheet and app have
         loaded, which reads as a flash before the editor appears. -->
    <style>
      html,
      body {
        background: #1e1f26;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #ffffff;
      }
      html[data-theme="autism"],
      html[data-theme="autism"] body {
        background: #2a2825;
      }
    </style>
    <script>
      // Runs before the stylesheet and bundle so the first paint already uses
      // the saved theme rather than defaulting to dark and correcting later.
      // Kept in sync with THEMES in src/theme.js — an unrecognised or missing
      // value falls back to dark, same as setTheme() does once the app loads.
      try {
        const stored = localStorage.getItem("justcode.theme");
        document.documentElement.dataset.theme = ["light", "autism"].includes(stored)
          ? stored
          : "dark";
      } catch (_) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="menubar"></div>

      <div id="toolbar">
        <button id="btn-new" title="New file (Ctrl+N)"><span>New</span></button>
        <button id="btn-open" title="Open file (Ctrl+O)"><span>Open</span></button>
        <button id="btn-save" title="Save (Ctrl+S)"><span>Save</span></button>
        <button id="btn-run" title="Run in browser (F5)" class="primary"><span>Run</span></button>
        <span class="spacer"></span>
        <button id="btn-theme" class="icon-only" title="Switch theme" aria-label="Switch theme"></button>
        <button
          id="btn-zoom-out"
          class="icon-only"
          title="Zoom out (Ctrl+-)"
          aria-label="Zoom out"
        ></button>
        <span id="zoom-level">14px</span>
        <button
          id="btn-zoom-in"
          class="icon-only"
          title="Zoom in (Ctrl++)"
          aria-label="Zoom in"
        ></button>
      </div>

      <!-- The panes and the terminal panel share this row/column: which of the
           two it is depends on the edge the terminal is docked to. -->
      <div id="workspace">
        <!-- One or more panes, each with its own tab bar and editor. -->
        <div id="panes"></div>
      </div>

      <!-- The Perpetum panel (`I-3`). Hidden until asked for, and a view onto
           the harness's journal rather than a second source of truth — closing
           the editor does not stop a loop, and reopening just reads again.
           JustCode works with the harness absent; the panel says so. -->
      <aside id="perp-panel" hidden aria-label="Perpetum harness"></aside>

      <div id="statusbar">
        <span id="status-path">No file</span>
        <span class="spacer"></span>
        <button id="status-lang" title="Select language mode"></button>
        <span id="status-cursor" title="Line, Column">1:1</span>
        <button id="status-problems" title="Show problems panel (F8)">0 problems</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
