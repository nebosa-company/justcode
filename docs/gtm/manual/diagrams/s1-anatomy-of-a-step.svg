<svg xmlns="http://www.w3.org/2000/svg" width="680" height="252" viewBox="0 0 680 252" role="img"><title>The anatomy of a Perpetum step: intent, side effect, outcome, and the state projection</title><desc>A step writes an intent record before anything happens, performs its side effect, writes an outcome record after, and the state file is rewritten from the journal. Both records live in the append-only journal; the state file is derived from it. A crash between the intent and the outcome deliberately leaves the intent open.</desc>

<text x="40" y="26" font-size="11" fill="#5F5E5A">one step — a bounded piece of work with a declared intent, a side effect, and a recorded outcome</text>

<rect x="40" y="46" width="135" height="66" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
<text x="107" y="66" font-size="12" font-weight="500" fill="#26215C" text-anchor="middle">1. intent</text>
<text x="107" y="84" font-size="11" fill="#3C3489" text-anchor="middle">written before</text>
<text x="107" y="100" font-size="11" fill="#3C3489" text-anchor="middle">anything happens</text>

<line x1="175" y1="79" x2="191" y2="79" stroke="#888780"/>
<polyline points="185,75 191,79 185,83" fill="none" stroke="#888780"/>

<rect x="195" y="46" width="135" height="66" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
<text x="262" y="66" font-size="12" font-weight="500" fill="#26215C" text-anchor="middle">2. the side effect</text>
<text x="262" y="84" font-size="11" fill="#3C3489" text-anchor="middle">the actual work —</text>
<text x="262" y="100" font-size="11" fill="#3C3489" text-anchor="middle">files, gates, calls</text>

<line x1="330" y1="79" x2="346" y2="79" stroke="#888780"/>
<polyline points="340,75 346,79 340,83" fill="none" stroke="#888780"/>

<rect x="350" y="46" width="135" height="66" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
<text x="417" y="66" font-size="12" font-weight="500" fill="#26215C" text-anchor="middle">3. outcome</text>
<text x="417" y="84" font-size="11" fill="#3C3489" text-anchor="middle">ok or not, and</text>
<text x="417" y="100" font-size="11" fill="#3C3489" text-anchor="middle">its evidence</text>

<line x1="485" y1="79" x2="501" y2="79" stroke="#888780"/>
<polyline points="495,75 501,79 495,83" fill="none" stroke="#888780"/>

<rect x="505" y="46" width="135" height="66" rx="4" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="572" y="66" font-size="12" font-weight="500" fill="#04342C" text-anchor="middle">4. state.md</text>
<text x="572" y="84" font-size="11" fill="#085041" text-anchor="middle">rewritten from</text>
<text x="572" y="100" font-size="11" fill="#085041" text-anchor="middle">the journal</text>

<line x1="107" y1="112" x2="107" y2="140" stroke="#0F6E56"/>
<polyline points="103,134 107,140 111,134" fill="none" stroke="#0F6E56"/>
<line x1="417" y1="112" x2="417" y2="140" stroke="#0F6E56"/>
<polyline points="413,134 417,140 413,134" fill="none" stroke="#0F6E56"/>
<line x1="572" y1="140" x2="572" y2="116" stroke="#0F6E56"/>
<polyline points="568,122 572,116 576,122" fill="none" stroke="#0F6E56"/>

<rect x="40" y="144" width="600" height="42" rx="4" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="340" y="163" font-size="12" font-weight="500" fill="#04342C" text-anchor="middle">journal.jsonl — append-only, never rewritten</text>
<text x="340" y="179" font-size="11" fill="#085041" text-anchor="middle">1 and 3 are records in it · 4 is derived from it, and if the two disagree the journal wins</text>

<text x="40" y="212" font-size="11" fill="#993C1D">A crash between 1 and 3 leaves the intent open, deliberately — that is what a crash looks like, and closing it would hide it.</text>
<text x="40" y="234" font-size="11" fill="#5F5E5A">Every step is named c&lt;cycle&gt;/&lt;phase or batch&gt;/s&lt;nn&gt; — the journal, the commit trailer, the board and perp explain all use that string.</text>
</svg>
