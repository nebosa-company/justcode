<svg xmlns="http://www.w3.org/2000/svg" width="680" height="268" viewBox="0 0 680 268" role="img"><title>The Perpetum phase machine: seven phases, the condition that ends each, and the loop back from F to B</title><desc>Phases A through G run in order. Only D carries work the loop can do; the rest are a person's work that the loop measures. F closes a cycle and reopens the next at B. G is never entered by the engine.</desc>

<text x="40" y="26" font-size="11" fill="#5F5E5A">purple is work the loop does · gray is a person's work the loop only measures</text>

<rect x="40" y="42" width="73" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="76" y="62" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">A</text>
<text x="76" y="77" font-size="11" fill="#444441" text-anchor="middle">initiation</text>
<polyline points="117,58 121,62 117,66" fill="none" stroke="#888780"/>

<rect x="127" y="42" width="73" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="163" y="62" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">B</text>
<text x="163" y="77" font-size="11" fill="#444441" text-anchor="middle">requirements</text>
<polyline points="204,58 208,62 204,66" fill="none" stroke="#888780"/>

<rect x="214" y="42" width="73" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="250" y="62" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">C</text>
<text x="250" y="77" font-size="11" fill="#444441" text-anchor="middle">prioritise</text>
<polyline points="291,58 295,62 291,66" fill="none" stroke="#888780"/>

<rect x="301" y="42" width="73" height="44" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
<text x="337" y="62" font-size="12" font-weight="500" fill="#26215C" text-anchor="middle">D</text>
<text x="337" y="77" font-size="11" fill="#3C3489" text-anchor="middle">develop</text>
<polyline points="378,58 382,62 378,66" fill="none" stroke="#888780"/>

<rect x="388" y="42" width="73" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="424" y="62" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">E</text>
<text x="424" y="77" font-size="11" fill="#444441" text-anchor="middle">release</text>
<polyline points="465,58 469,62 465,66" fill="none" stroke="#888780"/>

<rect x="475" y="42" width="73" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="511" y="62" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">F</text>
<text x="511" y="77" font-size="11" fill="#444441" text-anchor="middle">clean-up</text>

<rect x="562" y="42" width="73" height="44" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-dasharray="3 3"/>
<text x="598" y="62" font-size="12" font-weight="500" fill="#888780" text-anchor="middle">G</text>
<text x="598" y="77" font-size="11" fill="#888780" text-anchor="middle">sunset</text>

<polyline points="511,86 511,112 163,112 163,90" fill="none" stroke="#0F6E56"/>
<polyline points="159,96 163,90 167,96" fill="none" stroke="#0F6E56"/>
<text x="337" y="128" font-size="11" fill="#0F6E56" text-anchor="middle">F closes, and cycle n+1 opens at B — A runs once for the repository, never again</text>

<text x="598" y="106" font-size="11" fill="#888780" text-anchor="middle">no path in</text>

<line x1="40" y1="150" x2="640" y2="150" stroke="#D3D1C7"/>
<text x="40" y="170" font-size="11" fill="#5F5E5A">what ends each phase</text>

<text x="40" y="192" font-size="11" fill="#444441">A the binding loads and a vision exists · B every requirement carries a status · C a batch is planned and</text>
<text x="40" y="208" font-size="11" fill="#444441">no conflict is open · D n batches delivered and the gates green at a commit sha · E release notes for this</text>
<text x="40" y="224" font-size="11" fill="#444441">cycle and the gates green at a sha · F nothing open in the journal and the state file agrees with it</text>
<text x="40" y="246" font-size="11" fill="#993C1D">A phase that cannot meet its condition and has no work a loop can do parks, and waits for a person.</text>
</svg>
