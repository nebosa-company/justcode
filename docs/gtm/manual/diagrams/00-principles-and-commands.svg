<svg xmlns="http://www.w3.org/2000/svg" width="680" height="424" viewBox="0 0 680 424" role="img"><title>Perpetum principles, the commands that serve each, the phase cycle, and the journal</title><desc>Five principles across the top, each with the perp commands that serve it beneath. Below, the seven-phase cycle from initiation to sunset. At the foot, the append-only journal from which state, cost, decisions and markers are all derived.</desc>

<text x="40" y="26" font-size="11" fill="#5F5E5A">five principles, and the commands that serve each</text>

<rect x="40" y="36" width="108" height="58" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
<text x="94" y="57" font-size="12" font-weight="500" fill="#26215C" text-anchor="middle">survival</text>
<text x="94" y="72" font-size="11" fill="#3C3489" text-anchor="middle">nothing lives</text>
<text x="94" y="85" font-size="11" fill="#3C3489" text-anchor="middle">only in context</text>

<rect x="163" y="36" width="108" height="58" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
<text x="217" y="57" font-size="12" font-weight="500" fill="#26215C" text-anchor="middle">approvals</text>
<text x="217" y="72" font-size="11" fill="#3C3489" text-anchor="middle">parked, never</text>
<text x="217" y="85" font-size="11" fill="#3C3489" text-anchor="middle">blocking</text>

<rect x="286" y="36" width="108" height="58" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
<text x="340" y="57" font-size="12" font-weight="500" fill="#26215C" text-anchor="middle">anti-faking</text>
<text x="340" y="72" font-size="11" fill="#3C3489" text-anchor="middle">lying is made</text>
<text x="340" y="85" font-size="11" fill="#3C3489" text-anchor="middle">harder than work</text>

<rect x="409" y="36" width="108" height="58" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
<text x="463" y="57" font-size="12" font-weight="500" fill="#26215C" text-anchor="middle">tolerance</text>
<text x="463" y="72" font-size="11" fill="#3C3489" text-anchor="middle">degrade,</text>
<text x="463" y="85" font-size="11" fill="#3C3489" text-anchor="middle">do not break</text>

<rect x="532" y="36" width="108" height="58" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
<text x="586" y="57" font-size="12" font-weight="500" fill="#26215C" text-anchor="middle">a way in</text>
<text x="586" y="72" font-size="11" fill="#3C3489" text-anchor="middle">talk to it while</text>
<text x="586" y="85" font-size="11" fill="#3C3489" text-anchor="middle">it is running</text>

<text x="94" y="114" font-size="11" fill="#444441" text-anchor="middle">state</text>
<text x="94" y="128" font-size="11" fill="#444441" text-anchor="middle">resume</text>
<text x="94" y="142" font-size="11" fill="#444441" text-anchor="middle">rewind</text>
<text x="94" y="156" font-size="11" fill="#444441" text-anchor="middle">record</text>
<text x="94" y="170" font-size="11" fill="#444441" text-anchor="middle">unlock</text>

<text x="217" y="114" font-size="11" fill="#444441" text-anchor="middle">approvals</text>
<text x="217" y="128" font-size="11" fill="#444441" text-anchor="middle">approve</text>
<text x="217" y="142" font-size="11" fill="#444441" text-anchor="middle">reject</text>

<text x="340" y="114" font-size="11" fill="#444441" text-anchor="middle">gate</text>
<text x="340" y="128" font-size="11" fill="#444441" text-anchor="middle">check</text>
<text x="340" y="142" font-size="11" fill="#444441" text-anchor="middle">explain</text>
<text x="340" y="156" font-size="11" fill="#444441" text-anchor="middle">decisions</text>
<text x="340" y="170" font-size="11" fill="#444441" text-anchor="middle">cost</text>
<text x="340" y="184" font-size="11" fill="#444441" text-anchor="middle">changelog</text>

<text x="463" y="114" font-size="11" fill="#444441" text-anchor="middle">links</text>
<text x="463" y="128" font-size="11" fill="#444441" text-anchor="middle">ask</text>

<text x="586" y="114" font-size="11" fill="#444441" text-anchor="middle">chat</text>
<text x="586" y="128" font-size="11" fill="#444441" text-anchor="middle">btw</text>
<text x="586" y="142" font-size="11" fill="#444441" text-anchor="middle">watch</text>
<text x="586" y="156" font-size="11" fill="#444441" text-anchor="middle">control</text>
<text x="586" y="170" font-size="11" fill="#444441" text-anchor="middle">panel</text>

<line x1="40" y1="202" x2="640" y2="202" stroke="#D3D1C7"/>
<text x="40" y="221" font-size="11" fill="#5F5E5A">setting up and driving it</text>
<text x="640" y="221" font-size="11" fill="#444441" text-anchor="end">init · bind · run · cycle · phase · artifact · capture · schedule</text>

<text x="40" y="256" font-size="11" fill="#5F5E5A">the cycle — one pass, phases in order</text>

<rect x="40" y="266" width="73" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="76" y="284" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">A</text>
<text x="76" y="298" font-size="11" fill="#444441" text-anchor="middle">initiation</text>
<polyline points="117,282 121,286 117,290" fill="none" stroke="#888780"/>

<rect x="127" y="266" width="73" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="163" y="284" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">B</text>
<text x="163" y="298" font-size="11" fill="#444441" text-anchor="middle">requirements</text>
<polyline points="204,282 208,286 204,290" fill="none" stroke="#888780"/>

<rect x="214" y="266" width="73" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="250" y="284" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">C</text>
<text x="250" y="298" font-size="11" fill="#444441" text-anchor="middle">prioritise</text>
<polyline points="291,282 295,286 291,290" fill="none" stroke="#888780"/>

<rect x="301" y="266" width="73" height="40" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
<text x="337" y="284" font-size="12" font-weight="500" fill="#26215C" text-anchor="middle">D</text>
<text x="337" y="298" font-size="11" fill="#3C3489" text-anchor="middle">develop</text>
<polyline points="378,282 382,286 378,290" fill="none" stroke="#888780"/>

<rect x="388" y="266" width="73" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="424" y="284" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">E</text>
<text x="424" y="298" font-size="11" fill="#444441" text-anchor="middle">release</text>
<polyline points="465,282 469,286 465,290" fill="none" stroke="#888780"/>

<rect x="475" y="266" width="73" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="511" y="284" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">F</text>
<text x="511" y="298" font-size="11" fill="#444441" text-anchor="middle">clean-up</text>
<polyline points="552,282 556,286 552,290" fill="none" stroke="#888780"/>

<rect x="562" y="266" width="73" height="40" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="598" y="284" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">G</text>
<text x="598" y="298" font-size="11" fill="#444441" text-anchor="middle">sunset</text>

<line x1="340" y1="316" x2="340" y2="336" stroke="#0F6E56"/>
<polyline points="336,322 340,316 344,322" fill="none" stroke="#0F6E56"/>

<rect x="40" y="336" width="600" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="340" y="358" font-size="12" font-weight="500" fill="#04342C" text-anchor="middle">journal.jsonl — append-only, and the only source of truth</text>
<text x="340" y="374" font-size="11" fill="#085041" text-anchor="middle">state, cost, decisions, markers and release notes are all derived from it, never stored beside it</text>
</svg>
